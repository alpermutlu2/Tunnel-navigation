<div id="pyBanner" style="position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:9;background:#16202B;color:#F6F5F1;font:600 14px system-ui;padding:8px 16px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.25)">In-browser mode (experimental): starting Python…</div>
<script>
// Experimental: the LIVE controls run in this browser through Pyodide (tools/browser/worker.js),
// so /api/ping and /api/run are answered by a Web Worker instead of tools/serve.py.
(() => {
  const banner = document.getElementById("pyBanner");
  let worker = null, seq = 0; const pending = new Map();
  window.__inBrowserLive = true;
  // Over http(s) the worker is py/worker.js. Opened as a file (file://, origin "null") a browser
  // refuses a worker script from disk, so the page carries the worker's source and the simulator
  // package (base64 zip) and starts the worker from a Blob; Pyodide itself comes from the CDN.
  try {
    if (location.protocol.startsWith("http")) worker = new Worker("py/worker.js");
    else {
      const src = document.getElementById("pyWorkerSrc").textContent;
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
      const b64 = document.getElementById("pyZip").textContent.trim(), bin = atob(b64), buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      worker.postMessage({ kind: "init", zip: buf.buffer }, [buf.buffer]);
    }
  } catch (e) { banner.textContent = "In-browser mode unavailable: " + e.message + " (run python tools/serve.py, or open the page over http)"; worker = null; }
  if (worker) worker.onmessage = (e) => {
    const m = e.data;
    if (m.type === "status") { banner.textContent = m.text ? "In-browser mode (experimental): " + m.text : "In-browser mode: Python ready, LIVE controls run here (each run takes longer than with serve.py)";
      if (!m.text) setTimeout(() => banner.remove(), 6000); return; }
    const p = pending.get(m.id); if (!p) return; pending.delete(m.id);
    if (m.ok) p.resolve(new Response(m.body, { status: 200, headers: { "Content-Type": "application/json" } }));
    else { p.resolve(new Response(m.body, { status: 500 })); if (m.id === 0) banner.textContent = "In-browser mode failed to start: " + m.body; }
  };
  const realFetch = window.fetch.bind(window);
  window.fetch = (url, opts) => {
    const u = String(url);
    if (!worker || !(u.startsWith("/api/ping") || u.startsWith("/api/run"))) return realFetch(url, opts);
    const id = u.startsWith("/api/ping") ? 0 : ++seq;
    return new Promise(resolve => { pending.set(id, { resolve }); worker.postMessage({ id, kind: id === 0 ? "ping" : "run", query: u.split("?")[1] || "" }); });
  };
})();
</script>
